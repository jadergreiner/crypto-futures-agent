name: Model2 Critical Coverage

on:
  pull_request:
    branches: [main, develop]
    paths:
      - ".coveragerc"
      - ".github/workflows/model2-critical-coverage.yml"
      - "core/model2/**"
      - "scripts/model2/check_critical_module_coverage.py"
      - "tests/test_model2_*.py"
  push:
    branches: [main]
    paths:
      - ".coveragerc"
      - ".github/workflows/model2-critical-coverage.yml"
      - "core/model2/**"
      - "scripts/model2/check_critical_module_coverage.py"
      - "tests/test_model2_*.py"

jobs:
  critical-coverage:
    name: Coverage Gate by Critical Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run critical coverage gate
        run: |
          python scripts/model2/check_critical_module_coverage.py

      - name: Upload html coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model2-critical-coverage-html
          path: htmlcov/